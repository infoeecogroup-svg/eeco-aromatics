# ==============================================================================
# EECO AROMATICS - NGINX CONFIGURATION FOR CONTABO VPS (PORT: 3005)
# Save as: /etc/nginx/sites-available/eeco.conf
# Enable: sudo ln -s /etc/nginx/sites-available/eeco.conf /etc/nginx/sites-enabled/
# ==============================================================================

# 1. MAIN STORE FRONTEND (e.g. yourdomain.com)
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Allow photo uploads up to 20MB
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Hide & Block /admin from public visitors on the main domain
    location /admin {
        return 404;
    }

    # Next.js Static Cache
    location /_next/static {
        proxy_pass http://localhost:3005/_next/static;
        proxy_cache_valid 200 365d;
        access_log off;
    }
}

# 2. ISOLATED ADMIN PANEL SUBDOMAIN (e.g. admin.yourdomain.com)
server {
    listen 80;
    server_name admin.yourdomain.com;

    # Allow photo uploads up to 20MB
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Route root directly to /admin
    location = / {
        return 302 /admin;
    }

    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
